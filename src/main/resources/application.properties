# Database (Postgres / Supabase)
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:5}
spring.datasource.hikari.connection-timeout=${DB_POOL_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFE:1800000}
spring.datasource.hikari.pool-name=HikariPool-MediaSummary

# Multipart
spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:50MB}
spring.servlet.multipart.enabled=true
app.max-file-size=${APP_MAX_FILE_SIZE:52428800}

# Cleanup
app.cleanup.days=${APP_CLEANUP_DAYS:7}
app.cleanup.cron=${APP_CLEANUP_CRON:0 0 3 * * ?}

# Server
server.port=${PORT:8080}

# Mail (SMTP)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS:true}

# External APIs
assemblyai.api.key=${ASSEMBLYAI_API_KEY:}
assemblyai.poll.attempts=${ASSEMBLYAI_POLL_ATTEMPTS:240}
assemblyai.poll.delay.ms=${ASSEMBLYAI_POLL_DELAY_MS:5000}
assemblyai.poll.backoff.factor=${ASSEMBLYAI_POLL_BACKOFF_FACTOR:1.05}
assemblyai.speech.models=${ASSEMBLYAI_SPEECH_MODELS:universal-3-pro}
assemblyai.webhook.url=${ASSEMBLYAI_WEBHOOK_URL:}

groq.api.key=${GROQ_API_KEY:}
groq.api.url=${GROQ_API_URL:}

# Shared Object Storage (Supabase Storage)
supabase.url=${SUPABASE_URL:}
supabase.service.key=${SUPABASE_SERVICE_KEY:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:}
supabase.storage.public.base-url=${SUPABASE_STORAGE_PUBLIC_BASE_URL:}

# Redis queue
spring.redis.host=${REDIS_HOST:}
spring.redis.port=${REDIS_PORT:}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
app.queue.stream-key=${APP_QUEUE_STREAM_KEY:audio:jobs}
app.queue.consumer-group=${APP_QUEUE_CONSUMER_GROUP:audio-workers}
app.queue.consumer-name=${APP_QUEUE_CONSUMER_NAME:${HOSTNAME:worker-1}}

# API/Worker behavior
app.worker.enabled=${APP_WORKER_ENABLED:true}
app.worker.poll-ms=${APP_WORKER_POLL_MS:1000}
app.worker.batch-size=${APP_WORKER_BATCH_SIZE:3}
app.worker.queue-block-ms=${APP_WORKER_QUEUE_BLOCK_MS:1500}

# Worker pool/concurrency
app.worker.pool.core-size=${APP_WORKER_POOL_CORE_SIZE:2}
app.worker.pool.max-size=${APP_WORKER_POOL_MAX_SIZE:8}
app.worker.pool.queue-capacity=${APP_WORKER_POOL_QUEUE_CAPACITY:200}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:}
